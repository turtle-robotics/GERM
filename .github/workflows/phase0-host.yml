name: Phase 0 host contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements-host.txt
        working-directory: pi_hmi
      - run: python check_integration.py
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_phase0.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m0.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m1.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m1_http.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m2.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m3.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m4.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m5.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m5_clock.py' -v
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_m6.py' -v
        working-directory: pi_hmi
      - run: node --check static/history.js
        working-directory: pi_hmi
      - run: g++ -std=c++11 tests/firmware_behavior.cpp -o /tmp/germ-firmware-test && /tmp/germ-firmware-test
        working-directory: pi_hmi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/germ-browser" playwright@1.62.1
      - run: '"$RUNNER_TEMP/germ-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node tests/browser_checks.cjs
        working-directory: pi_hmi
        env:
          GERM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/germ-browser/node_modules/playwright
      - run: node tests/browser_m4.cjs
        working-directory: pi_hmi
        env:
          GERM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/germ-browser/node_modules/playwright
      - run: node tests/browser_m5.cjs
        working-directory: pi_hmi
        env:
          GERM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/germ-browser/node_modules/playwright
      - run: node tests/browser_m6.cjs
        working-directory: pi_hmi
        env:
          GERM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/germ-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-browser-host-evidence
          path: |
            build/m1-browser/
            build/m4-browser/
            build/m5-browser/
            build/m6-browser/
