name: Phase 0 host contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements-host.txt
        working-directory: pi_hmi
      - run: python check_integration.py
        working-directory: pi_hmi
      - run: python -m unittest discover -s tests -p 'test_phase0.py' -v
        working-directory: pi_hmi
      - run: g++ -std=c++11 tests/firmware_behavior.cpp -o /tmp/germ-firmware-test && /tmp/germ-firmware-test
        working-directory: pi_hmi
